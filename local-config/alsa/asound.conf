# Corrected: control.card and ctl.!default card were both 1, but the HifiBerry
# is card 0 and is the only card (onboard audio is disabled via
# dtparam=audio=off in /boot/config.txt). Stale from before that change.
# Symptom: anything opening ALSA "default" got
#   ALSA lib pcm_softvol.c: (softvol_load_control) Cannot open CTL hw:1
pcm.hifiberry {
    type            softvol
    slave.pcm       "plughw:CARD=sndrpihifiberry,DEV=0"
    control.name    "Master"
    control.card    0
}
pcm.!default {
    type            plug
    slave.pcm       "hifiberry"
}
ctl.!default {
    type            hw
    card            0
}
