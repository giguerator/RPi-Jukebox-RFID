[DEFAULT]
enabled: True

[Shutdown]
enabled: True
Type: ShutdownButton
Pin: 17
edge: falling
pull_up: True
hold_time: 5
iteration_time: 1
functionCall: functionCallShutdown

[LowBattery]
enabled: True
Type: ShutdownButton
Pin: 12
pull_up_down: pull_down
edge: rising
hold_time: 30
iteration_time: 2
functionCall: functionCallLowBatteryShutdown

# The sections below were handled by mopidy-raspberry-gpio until 2026-09-11.
# Retiring Mopidy took the music buttons with it, so they move here. Pins and
# active_low come verbatim from [raspberry-gpio] in /etc/mopidy/mopidy.conf:
#   bcm5=play_pause  bcm6=volume_down  bcm16=next   bcm20=play_pause
#   bcm24=volume_up  bcm27=prev        bcm22=next   bcm15=do_nothing
# bcm15 was do_nothing and is deliberately omitted.

[PlayPause]
enabled: True
Type: Button
Pin: 5
pull_up: True
hold_time: 0.3
functionCall: functionCallPlayerPause

[PlayPause2]
enabled: True
Type: Button
Pin: 20
pull_up: True
hold_time: 0.3
functionCall: functionCallPlayerPause

[VolumeDown]
enabled: True
Type: Button
Pin: 6
pull_up: True
hold_time: 0.3
hold_repeat: True
functionCall: functionCallVolD

[VolumeUp]
enabled: True
Type: Button
Pin: 24
pull_up: True
hold_time: 0.3
hold_repeat: True
functionCall: functionCallVolU

[NextSong]
enabled: True
Type: Button
Pin: 16
pull_up: True
hold_time: 0.3
functionCall: functionCallPlayerNext

[NextSong2]
enabled: True
Type: Button
Pin: 22
pull_up: True
hold_time: 0.3
functionCall: functionCallPlayerNext

[PrevSong]
enabled: True
Type: Button
Pin: 27
pull_up: True
hold_time: 0.3
functionCall: functionCallPlayerPrev
