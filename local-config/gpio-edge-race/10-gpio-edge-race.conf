# Drop-in for phoniebox-gpio-control.service.
# Install at:
#   /etc/systemd/system/phoniebox-gpio-control.service.d/10-gpio-edge-race.conf
#
# A drop-in rather than an edit to the unit, so a Phoniebox reinstall that
# rewrites the unit file does not silently drop this.
#
# The "+" prefix runs the helper as root even though the service itself runs
# as User=pi. Requires systemd >= 231; the box has 241.

[Service]
ExecStartPre=+/usr/local/sbin/phoniebox-gpio-prepare.sh
